<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTSChatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="logo">
        <a href="https://www.uts.edu.my/" target="_blank">
            <img src="https://itd.uts.edu.my/wp-content/uploads/2021/10/01-BLUE-1024x344.png" alt="Logo">
        </a>
    </div>
    <div id="about-uts">
        <h2><a href="https://www.uts.edu.my/about-university/" target="_blank" id="about-uts-link">ABOUT UTS</a></h2>
        <p>
            For more information, visit our <a href="https://www.uts.edu.my/" target="_blank">Website</a>.
        </p>
        <p>
            Want to <a href="https://arc.uts.edu.my/" target="_blank" style="text-decoration: underline; color: blue;">Contact Us</a>?
        </p>
    </div>
    <div id="chat-container">
        <div id="ai-chatbot">UTSChatbot</div>
        <div id="chatbox">
            <ul id="chat-messages"></ul>
        </div>
        <div id="input-container">
            <input type="text" id="userInput" placeholder="Ask Me anything about UTS">
            <button id="sendButton">Send</button>
        </div>
    </div>
    <div id="watermark">Created by group <span>Botbuilders</span></div>
    <script src="script.js"></script>
</body>
</html>
